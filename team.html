<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Management</title>
</head>

<body>

    <h1>Team Management</h1>

    <h2>Team Members</h2>

    <table border="1" cellpadding="10">

        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Action</th>
        </tr>

        <tr>
            <td>Eman Fatima</td>
            <td>eman@example.com</td>
            <td>Admin</td>
            <td><button>Remove</button></td>
        </tr>

        <tr>
            <td>Member 2</td>
            <td>member2@example.com</td>
            <td>Project Manager</td>
            <td><button>Remove</button></td>
        </tr>

        <tr>
            <td>Member 3</td>
            <td>member3@example.com</td>
            <td>Team Member</td>
            <td><button>Remove</button></td>
        </tr>

    </table>

    <br>

    <h2>Add Team Member</h2>

    <form>

        <label>Name:</label>
        <br>
        <input type="text" placeholder="Enter member name">
        <br><br>

        <label>Email:</label>
        <br>
        <input type="email" placeholder="Enter member email">
        <br><br>

        <label>Role:</label>
        <br>
        <select>
            <option>Team Member</option>
            <option>Project Manager</option>
            <option>Admin</option>
        </select>
        <br><br>

        <button type="submit">Add Member</button>

    </form>

</body>
</html>c
